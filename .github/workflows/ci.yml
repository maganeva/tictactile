name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No ruby-version input on purpose: setup-ruby's default already reads
      # .ruby-version, which is the single source of truth shared with chruby
      # locally and with Heroku via Gemfile.lock. An earlier `ruby-version-file:`
      # input here was silently ignored — it is not valid on setup-ruby@v1 — so
      # the correct version was coming from this default all along.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rake test
      # The expensive integrity check, kept off the application's boot path so
      # dyno restarts stay well inside Heroku's 60s R10 budget. Running it here
      # means no commit can ship a chunk set that does not reassemble to the
      # original 183 MB master byte for byte.
      #
      # Must run after `rake test`, not before: `video:verify` calls
      # `assemble!`, which creates public/img/videos/0-rob-d.mp4. On a fresh
      # checkout that file is gitignored and never committed, so if this ran
      # first, `rake test` would load config/environment.rb against an
      # already-assembled file, `assemble!` would short-circuit to :cached,
      # and every Range/serving test in test/smoke_test.rb would pass even
      # with the boot-time assembly deleted entirely. Running `rake test`
      # first forces it to perform the real merge through the boot path, and
      # `video:verify` then SHA-256s the exact artifact that boot produced.
      - run: bundle exec rake video:verify
      - name: Boot the production server
        run: |
          RACK_ENV=production PORT=3000 bundle exec puma -C config/puma.rb &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:3000/ && break
            sleep 1
          done
          curl -fsSL -o /dev/null -w 'home %{http_code}\n' http://localhost:3000/
          curl -fsSL -o /dev/null -w 'asset %{http_code}\n' http://localhost:3000/img/videos/haiku-th.jpg
          code=$(curl -s -r 0-99 -o /dev/null -w '%{http_code}' http://localhost:3000/img/videos/0-rob-d.mp4)
          echo "video range $code"
          [ "$code" = "206" ] || { echo "expected 206 for a Range request, got $code"; exit 1; }
          kill %1
